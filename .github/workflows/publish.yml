name: Publish npm packages

on:
  push:
    branches:
      - main
    tags:
      - "qwen-token-plan-cn-responses-v*"
      - "serverchan-notify-v*"
    paths:
      - "packages/qwen-token-plan-cn-responses/lib/catalog.snapshot.json"

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@latest
      - name: Select and validate tagged package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "${GITHUB_REF_TYPE}:$tag" in
            tag:qwen-token-plan-cn-responses-v*)
              workspace="dsh-qwen-token-plan-cn-responses"
              directory="packages/qwen-token-plan-cn-responses"
              version="${tag#qwen-token-plan-cn-responses-v}"
              ;;
            tag:serverchan-notify-v*)
              workspace="dsh-serverchan-notify"
              directory="packages/serverchan-notify"
              version="${tag#serverchan-notify-v}"
              ;;
            branch:main)
              workspace="dsh-qwen-token-plan-cn-responses"
              directory="packages/qwen-token-plan-cn-responses"
              version="$(node -p "require('./$directory/package.json').version")"
              tag="qwen-token-plan-cn-responses-v$version"
              ;;
            *) echo "unsupported release ref: ${GITHUB_REF_TYPE}:$tag" >&2; exit 1 ;;
          esac
          actual="$(node -p "require('./$directory/package.json').version")"
          test "$actual" = "$version" || { echo "tag=$version package=$actual" >&2; exit 1; }
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm run check --workspace "${{ steps.package.outputs.workspace }}"
      - run: npm run pack:check
      - name: Publish with npm Trusted Publishing
        run: npm publish --workspace "${{ steps.package.outputs.workspace }}" --access public
      - name: Tag and release merged catalog updates
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.package.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "${{ steps.package.outputs.workspace }} v${{ steps.package.outputs.version }}"
          git push origin "$tag"
          gh release create "$tag" \
            --title "Qwen Token Plan CN Responses v${{ steps.package.outputs.version }}" \
            --notes "Automated release of the reviewed, release-bundled official catalog. Published through npm Trusted Publishing with provenance."
